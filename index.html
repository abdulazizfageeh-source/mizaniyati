  if (type === 'income') return INCOME_LABELS.map(l => [l, l === 'دخل مقطوع' ? 'دخل مقطوع (مرة واحدة)' : l]);
  if (type === 'expense') return S.categories.map(c => [c.id, c.name]).concat([['', 'غير مصنف']]);
  const ordered = l => l.filter(c => c.status !== 'مغلق').concat(l.filter(c => c.status === 'مغلق')).map(c => [c.id, c.name + (c.status === 'مغلق' ? ' (مغلق)' : '')]);
  if (type === 'commitment') return S.commitments.length ? ordered(S.commitments) : [['', 'لا توجد التزامات، أضفها من شاشة البيانات']];
  if (type === 'debt') return S.debts.length ? ordered(S.debts) : [['', 'لا توجد ديون، أضفها من شاشة البيانات']];
  if (type === 'saving') return S.goals.map(g => [g.id, g.name]).concat([['', 'ادخار عام']]);
  return [];
}
function openTx(preset){
  preset = preset || {};
  const t = preset.id ? S.tx.find(x => x.id === preset.id) : null;
  const type0 = t ? t.type : (preset.type || 'expense');
  const ref0 = t ? (t.type === 'income' ? t.label : t.ref) : (preset.ref || '');
  const body = `<div class="form-grid">
    ${F.seg('tx-type', 'نوع الحركة', TX_TYPES.map(x => [x.key, x.label]), type0)}

    <div id="tx-ref-wrap"></div>
    <div class="two">${F.date('tx-date', 'التاريخ', t ? t.date : todayISO())}${F.text('tx-desc', 'البيان', t ? t.desc : (preset.desc || ''), 'placeholder="مثال: مقاضي الأسبوع"')}</div>
    <div id="tx-adv"></div>
    <details class="more" ${t && t.notes ? 'open' : ''}><summary>ملاحظات</summary><div class="form-grid">${F.area('tx-notes', 'ملاحظات', t ? t.notes : '')}</div></details>
  </div>`;
  openModal(t ? 'تعديل حركة' : 'حركة جديدة', body, footerSave(t ? 'del-tx' : null), () => {
    const drawRef = (type, ref) => {
      const opts = refOptions(type);
      const label = type === 'income' ? 'نوع الدخل' : type === 'expense' ? 'الفئة' : type === 'saving' ? 'هدف الادخار' : 'الجهة';
      const has = opts.some(o => o[0] === ref);
      const v = has && (ref !== '' || t) ? ref : (opts[0] ? opts[0][0] : '');
      $('#tx-ref-wrap').innerHTML = F.select('tx-ref', label, opts, v);
      $('#tx-ref').addEventListener('change', () => { drawAdv(); prefill(); });
      drawAdv();
    };
    const drawAdv = () => {
      const type = radio('tx-type'), ref = val('tx-ref'), box = $('#tx-adv');
      box.innerHTML = '';
      if (type === 'income') {
        const C = lastC;
        if (ref === 'راتب') {
          const prev = S.tx.filter(x => x.type === 'income' && x.label === 'راتب' && (!t || x.id !== t.id) && dayNum(x.date) >= dayNum(C.cyc.start) && dayNum(x.date) <= C.tN);
          const startedAfter = isISO(S.settings.startDate) && dayNum(S.settings.startDate) > dayNum(C.cyc.start);
          box.innerHTML = prev.length ? `<div class="info-line warn-line">سجّلت راتب هذه الدورة يوم ${fmtDate(prev[0].date)}. لا تسجّله مرة ثانية حتى لا يُحسب مرتين.</div>`
            : startedAfter && !t ? '<div class="info-line">بدأت المتابعة بعد آخر راتب، فهو محسوب ضمن المبلغ الافتتاحي. سجّل هنا الراتب القادم فقط عند نزوله.</div>'
            : '<div class="info-line">سجّله مرة واحدة عند نزوله. إذا نزل قبل موعده بأيام تبدأ دورة الراتب الجديدة من يوم تسجيله.</div>';
        } else if (ref === 'دخل مقطوع') {
          box.innerHTML = '<div class="info-line">يدخل هذا الشهر فقط ولا يتكرر في التوقعات. إذا اخترت تاريخًا قادمًا قبل الراتب يُحسب كدخل متوقع.</div>';
        } else {
          box.innerHTML = '<div class="info-line">سجّله عند وصوله. قيمته الشهرية تُضبط من الإعدادات وتدخل في التوقعات.</div>';
        }

      }
      if (type !== 'commitment' && type !== 'debt') return;

      box.innerHTML = F.check('tx-advance', `انقل الموعد القادم من ${fmtDate(it.nextDue)} إلى ${fmtDate(nd)}`, on, it.installmentsLeft > 0 ? 'وتُنقص الأقساط المتبقية قسطًا واحدًا' : '');

    drawRef(type0, ref0);

  });
  modalSave = () => {

    if (!(amount > 0)) return setErr('أدخل المبلغ.');

    const rec = {id: t ? t.id : uid(), date, type, ref: type === 'income' ? '' : ref, label: '', amount, desc: val('tx-desc').trim().slice(0, 160), notes: val('tx-notes').trim().slice(0, 400)};
    rec.label = type === 'income' ? (ref || 'دخل') : refName(rec);

    if ((type === 'commitment' || type === 'debt') && checked('tx-advance')) {
      const it = (type === 'commitment' ? S.commitments : S.debts).find(x => x.id === ref);
      if (it && isISO(it.nextDue)) {
        it.nextDue = addMonths(it.nextDue, 1);

  };
}

    <div class="two">${F.date('i-due', 'تاريخ الاستحقاق القادم', x ? x.nextDue : '')}${F.int('i-left', 'الأقساط المتبقية', x ? x.installmentsLeft : null, 'اختياري')}</div>
    <div class="two">${F.select('i-status', 'الحالة', STATUSES.map(v => [v, v]), x ? x.status : 'نشط')}${F.select('i-prio', 'الأولوية', prioOpts, x && x.priorityOverride ? x.priorityOverride : '')}</div>
    ${cx && cx.paid > 0 ? `<div class="info-line">سددت منذ بداية المتابعة ${fmt(cx.paid)} ر.س</div>` : ''}

    </div></details>
  </div>`;
  openModal(x ? (isC ? 'تعديل التزام' : 'تعديل دين') : (isC ? 'التزام جديد' : 'دين جديد'), body, footerSave(x ? 'del-' + group : null), () => {

    const leftRaw = val('i-left').trim();

      /* نخزن الرصيد عند بداية المتابعة = المتبقي + ما سُدد، فيبقى المتبقي كما كتبته */

let downloadsApi = null;
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsApi = d; }).catch(() => {}); } catch (e) {}
function backupText(){ return JSON.stringify(Object.assign({}, S, {exportedAt: new Date().toISOString(), app: 'ميزانيتي'}), null, 1); }
function openExport(){
  const text = backupText();
  const canDownload = !!downloadsApi || !framed;
  openModal('تصدير نسخة احتياطية', `<div class="form-grid">
    <p style="font-size:14px;color:var(--ink-2)">احفظ الملف في مكان آمن (ملفات الآيفون أو مجلد على الكمبيوتر). لاستعادة البيانات استخدم «استيراد نسخة».</p>
    ${canDownload ? '' : '<div class="info-line">تنزيل الملفات غير متاح داخل هذه النافذة. انسخ النص واحفظه في ملاحظة أو ملف نصي.</div>'}
    <label class="fld"><span>محتوى النسخة</span><textarea id="exp-text" readonly style="min-height:120px;font-size:12px;direction:ltr;text-align:left">${esc(text)}</textarea></label>
  </div>`, `<button type="button" class="btn" data-act="copy-backup">نسخ النص</button><span class="grow"></span>${canDownload ? '<button type="button" class="btn btn-primary" data-act="download-backup">حفظ الملف</button>' : ''}`);
  modalSave = null;
}
async function downloadBackup(){
  const name = `mizaniyati-backup-${todayISO()}.json`, text = backupText();
  let coarse = false; try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
  if (!framed && coarse && navigator.canShare && typeof File === 'function') {
    try {
      const file = new File([text], name, {type: 'application/json'});
      if (navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); toast('اختر «حفظ في الملفات» للاحتفاظ بالنسخة'); closeModal(); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (downloadsApi) {
    try { await downloadsApi.save({filename: name, data: text}); toast('تم حفظ النسخة'); closeModal(); return; }
    catch (e) { if (e && e.code === 'declined') return; if (framed) { toast('تعذر التنزيل هنا، استخدم النسخ'); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('تم تنزيل النسخة'); closeModal();
  } catch (e) { toast('تعذر التنزيل، استخدم النسخ'); }
}
async function copyBackup(){
  const ta = $('#exp-text');
  try { await navigator.clipboard.writeText(ta.value); toast('تم نسخ النسخة الاحتياطية'); }
  catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('تم تحديد النص، انسخه يدويًا إن لزم'); } catch (e2) { toast('حدد النص وانسخه يدويًا'); } }
}
function openImport(){

    <p style="font-size:14px;color:var(--ink-2)">اختر ملف النسخة أو الصق محتواها. الاستيراد يستبدل البيانات الحالية بالكامل.</p>
    <label class="fld"><span>ملف النسخة</span><input id="imp-file" type="file" accept=".json,application/json,text/plain"></label>

/* =========================================================
   الحفظ والعرض والأحداث
   ========================================================= */
function commit(msg){ save(); closeModal(); render(); if (msg) toast(msg); }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

function render(){
  const C = compute(); lastC = C;
  renderHeader(C);
  $('#view-dash').hidden = ui.view !== 'dash';
  $('#view-data').hidden = ui.view !== 'data';
  if (ui.view === 'dash') renderDash(C); else renderData(C);
}
function go(view, tab){
  ui.view = view; if (tab) ui.tab = tab; saveUI(); render();
  window.scrollTo(0, 0);
}

  'edit-debt': edit('debt', openDebt),
  'edit-goal': edit('goal', openGoal),
  'edit-cat': edit('cat', openCat),
  'add-commitment': () => openCommitment(),
  'add-debt': () => openDebt(),
  'add-goal': () => openGoal(),
  'add-cat': () => openCat(),
  close: () => closeModal(),
  'modal-save': (el, e) => { e.preventDefault(); if (modalSave) modalSave(); },
  export: () => openExport(),
  'download-backup': () => downloadBackup(),
  'copy-backup': () => copyBackup(),
  import: () => openImport(),
  reset: () => confirmBox('مسح كل البيانات؟', 'ستُحذف كل الحركات والالتزامات والديون والإعدادات من هذا الجهاز. صدّر نسخة احتياطية أولًا إن كنت تحتاجها.', 'مسح الكل', () => { S = emptyState(); ui.tab = 'settings'; commit('تم مسح البيانات'); }, true),
  'load-demo': () => confirmBox('عرض البيانات التجريبية؟', 'ستُستبدل بياناتك الحالية ببيانات مثال. صدّر نسخة احتياطية أولًا إن كنت تحتاج بياناتك.', 'عرض المثال', () => { S = demoState(); ui.view = 'dash'; saveUI(); commit('تم تحميل البيانات التجريبية'); }, true),
  'start-fresh': () => confirmBox('البدء ببياناتك', 'سيتم مسح البيانات التجريبية وفتح الإعدادات لتدخل راتبك ويوم نزوله والمبلغ المتاح معك الآن.', 'ابدأ', () => { S = emptyState(); ui.view = 'data'; ui.tab = 'settings'; saveUI(); commit('أدخل بياناتك الأساسية للبدء'); })
};
const delMsg = {
  tx: ['حذف الحركة؟', 'ستُحذف هذه الحركة وتُعاد الحسابات.'],
  commitment: ['حذف الالتزام؟', 'سيُحذف الالتزام. الحركات المرتبطة به تبقى في السجل.'],
  debt: ['حذف الدين؟', 'سيُحذف الدين. الحركات المرتبطة به تبقى في السجل.'],
  goal: ['حذف الهدف؟', 'سيُحذف الهدف. حركات الادخار المرتبطة به تبقى في السجل.'],
  cat: ['حذف الفئة؟', 'ستُحذف الفئة، ومصروفاتها السابقة تظهر كـ«غير مصنف».']
};
const pools = {tx: () => S.tx, commitment: () => S.commitments, debt: () => S.debts, goal: () => S.goals, cat: () => S.categories};
['tx', 'commitment', 'debt', 'goal', 'cat'].forEach(k => {
  ACT['del-' + k] = () => {
    const id = editing.kind === k ? editing.id : null; if (!id) return;
    const [t, m] = delMsg[k];
    confirmBox(t, m, 'حذف', () => {
      const arr = pools[k](); const i = arr.findIndex(x => x.id === id);
      if (i >= 0) {
        const gone = arr.splice(i, 1)[0];
        if (gone && k !== 'tx') S.tx.forEach(tx => { if (tx.ref === id && !tx.label) tx.label = gone.name; });
      }
      editing = {kind: null, id: null};
      commit('تم الحذف');
    }, true);
  };
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'BUTTON' && el.type === 'submit') e.preventDefault();
  f(el, e);
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'mdl-form' && modalSave) modalSave(); });

/* الإعدادات والميزانية تُحفظ عند التعديل */
function softRender(){
  setTimeout(() => {
    const a = document.activeElement, id = a && a.id;
    render();
    if (id) { const n = document.getElementById(id); if (n && n !== a) try { n.focus(); } catch (e) {} }
  }, 0);
}
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.setting) {
    const k = t.dataset.setting; let v;
    if (k === 'startDate') { if (!isISO(t.value)) return; v = t.value; }
    else if (k === 'extraPayment') { v = t.value.trim() === '' ? null : Math.max(0, parseAmt(t.value)); S.settings[k] = v; save(); softRender(); toast(v == null ? 'رجع للحساب التلقائي' : 'تم الحفظ'); return; }
    else if (k === 'payday') { v = clamp(Math.round(parseAmt(t.value)) || 27, 1, 31); }
    else v = parseAmt(t.value);
    if (k !== 'startingBalance' && k !== 'startDate') v = Math.max(0, v);
    S.settings[k] = v; save(); softRender(); toast('تم الحفظ');
  } else if (t.dataset.catBudget) {
    const c = S.categories.find(x => x.id === t.dataset.catBudget); if (!c) return;
    c.budget = Math.max(0, parseAmt(t.value)); save(); softRender(); toast('تم تحديث الميزانية');
  }
});

window.addEventListener('scroll', () => { $('#topbar').classList.toggle('scrolled', window.scrollY > 4); }, {passive: true});
let rT = null, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (window.innerWidth !== lastW && lastC && document.getElementById('fc-chart')) { lastW = window.innerWidth; drawForecast(lastC); } }, 150); });
/* تحديث تلقائي عند تغيّر اليوم أو العودة للصفحة */
let lastDay = todayISO();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayISO() !== lastDay) { lastDay = todayISO(); if (modal.hidden) render(); } });

/* ---------- نسخة التطبيق: العمل دون إنترنت ---------- */
const APP_VERSION = '1.1';
function isStandalone(){ try { return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } }
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInstallHint(){ return isIOS && !isStandalone() && storeGet('mizaniyati.hint') !== '1'; }
ACT['hide-hint'] = () => { storeSet('mizaniyati.hint', '1'); render(); };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

if (!storeSet('mizaniyati.test', '1')) storageOK = false;
render();
})();
</script>
